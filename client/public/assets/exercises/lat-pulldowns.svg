<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#1a1c24"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Glow Circle -->
  <circle cx="400" cy="220" r="160" fill="#ccff00" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Exercise Icon / Posture Graphic Container -->
  <g transform="translate(400, 210)">
    <!-- Central Halo Circle -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#ccff00" stroke-dasharray="8 8" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Exercise Diagram Paths -->
    
      <!-- Cable Machine Structure -->
      <line x1="0" y1="-120" x2="0" y2="-60" stroke="#9ca3af" stroke-width="4"/>
      <!-- Lat Bar -->
      <line x1="-90" y1="-60" x2="90" y2="-60" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <circle cx="-90" cy="-60" r="5" fill="#ccff00"/>
      <circle cx="90" cy="-60" r="5" fill="#ccff00"/>
      <!-- Athlete Head -->
      <circle cx="0" cy="-20" r="16" fill="#ccff00"/>
      <!-- Torso -->
      <path d="M -20,0 L 20,0 L 15,60 L -15,60 Z" fill="#ffffff"/>
      <!-- Arms Holding Bar -->
      <path d="M -20,0 L -70,-55" stroke="#ccff00" stroke-width="8" stroke-linecap="round"/>
      <path d="M 20,0 L 70,-55" stroke="#ccff00" stroke-width="8" stroke-linecap="round"/>
    
  </g>

  <!-- Top Category Badge -->
  <rect x="40" y="35" width="130" height="32" rx="16" fill="#ccff00" fill-opacity="0.15" stroke="#ccff00" stroke-opacity="0.3" stroke-width="1"/>
  <text x="105" y="56" fill="#ccff00" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">LATS & BACK</text>

  <!-- Title & Info Overlay -->
  <text x="40" y="440" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Lat Pulldowns</text>
  <text x="40" y="468" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Cable Overhead Pull-Down • Latissimus Dorsi Focus</text>

  <!-- Watermark -->
  <text x="760" y="468" fill="#ffffff" fill-opacity="0.2" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="end">FITFORGE AI</text>
</svg>