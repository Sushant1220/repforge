<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="50%" stop-color="#121318"/>
      <stop offset="100%" stop-color="#1a1c24"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Ambient Glow Circle -->
  <circle cx="400" cy="220" r="160" fill="#ec4899" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Exercise Icon / Posture Graphic Container -->
  <g transform="translate(400, 210)">
    <!-- Central Halo Circle -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="url(#glowGrad)" stroke-width="3" opacity="0.6"/>
    <circle cx="0" cy="0" r="115" fill="none" stroke="#ec4899" stroke-dasharray="8 8" stroke-width="1.5" opacity="0.4"/>
    
    <!-- Exercise Diagram Paths -->
    
      <!-- Cable Line -->
      <line x1="-90" y1="-30" x2="-10" y2="-30" stroke="#9ca3af" stroke-width="4"/>
      <!-- Athlete -->
      <circle cx="30" cy="-45" r="15" fill="#ec4899"/>
      <path d="M 30,-25 L 30,45 M 30,45 L 15,105 M 30,45 L 45,105" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
      <!-- Flared Arms Pulling Rope to Face -->
      <path d="M 30,-15 L 0,-30 L -15,-30" stroke="#ccff00" stroke-width="8" stroke-linecap="round" fill="none"/>
    
  </g>

  <!-- Top Category Badge -->
  <rect x="40" y="35" width="130" height="32" rx="16" fill="#ec4899" fill-opacity="0.15" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1"/>
  <text x="105" y="56" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">REAR DELTS & UPPER BACK</text>

  <!-- Title & Info Overlay -->
  <text x="40" y="440" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Face Pulls</text>
  <text x="40" y="468" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14" font-weight="500">High Cable Rope Pull • Rear Deltoid & External Rotation</text>

  <!-- Watermark -->
  <text x="760" y="468" fill="#ffffff" fill-opacity="0.2" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="end">FITFORGE AI</text>
</svg>